name: hotel-booking-python

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_booking}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_booking_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    image: hotel-booking-python-api:local
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-hotel_booking}:${POSTGRES_PASSWORD:-hotel_booking_local}@db:5432/${POSTGRES_DB:-hotel_booking}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../app:/app/app:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    init: true

  migrate:
    image: hotel-booking-python-api:local
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-hotel_booking}:${POSTGRES_PASSWORD:-hotel_booking_local}@db:5432/${POSTGRES_DB:-hotel_booking}
    depends_on:
      db:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    profiles:
      - tools
    init: true

volumes:
  postgres-data:
