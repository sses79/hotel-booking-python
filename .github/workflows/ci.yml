name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_booking_test
          POSTGRES_USER: hotel_booking
          POSTGRES_PASSWORD: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_booking -d hotel_booking_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: >-
        postgresql+asyncpg://hotel_booking:hotel_booking_test@localhost:5432/hotel_booking_test
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://hotel_booking:hotel_booking_test@localhost:5432/hotel_booking_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest
